[package]
name = "colamd"
version = "2.7.2"
description = "A free, elegant Markdown editor for macOS, Windows and Linux"
authors = ["marswave.ai"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
