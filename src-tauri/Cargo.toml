[package]
name = "loomark"
version = "2.8.4"
description = "A free, elegant Markdown editor for macOS, Windows and Linux"
authors = ["marswave.ai"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
rfd = "0.15"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tauri-plugin-clipboard-manager = "2.1.0-beta.7"
tauri-plugin-updater = "2.0.0-rc.4"
# 导出 PDF / 图片 / Word 时渲染侧把产物以 base64 交过来（见 export.rs）。
# 版本跟随依赖树里已有的那份，不引入重复依赖。
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
