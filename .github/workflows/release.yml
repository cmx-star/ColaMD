name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mac_arch:
        description: 'macOS architecture (separate = one installer per architecture)'
        type: choice
        options:
          - separate
          - x64
          - arm64
          - universal
        default: separate

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            target: aarch64-apple-darwin
          - os: macos-14
            platform: mac
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: win
            target: ''
          - os: ubuntu-22.04
            platform: linux
            target: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # The Linux shell is a WebKitGTK window, so the runner needs the development
      # packages that Tauri links against.
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install

      - name: Build and bundle
        shell: bash
        env:
          # Signing and notarization are optional here: without the secrets the build
          # still produces working bundles, only unsigned ones.
          APPLE_CERTIFICATE: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'mac' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          TARGET_ARGS=""
          if [ -n "${{ matrix.target }}" ]; then
            TARGET_ARGS="--target ${{ matrix.target }}"
          fi
          # The universal target merges both architectures into one bundle; asked for
          # explicitly, it is the only case where one runner produces one installer.
          if [ "${{ matrix.platform }}" = "mac" ] && [ "${{ inputs.mac_arch || 'separate' }}" = "universal" ]; then
            TARGET_ARGS="--target universal-apple-darwin"
          fi
          npx tauri build $TARGET_ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

  # Tag pushes publish a release; manual dispatches are build-only so the
  # artifacts can be verified (or attached manually) before attaching them.
  #
  # `COLAMD_PRERELEASE=true` publishes the release as a pre-release. Stable
  # installs ask GitHub for `/releases/latest`, which never returns a
  # pre-release, so those users are not offered the version; anyone who wants
  # it can still download it from the releases page. The flag is read at
  # creation time, so there is no window in which a pre-release is briefly
  # live as the latest release. Promote the same build by clearing the
  # variable and running `gh release edit <tag> --prerelease=false --latest`.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The version's section in resources/demo/changelog.md is what users
      # read in the app, so it is also what they read on the release page.
      # GitHub's generated notes only ever listed merge commits.
      - name: Take the release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' resources/demo/changelog.md > "$RUNNER_TEMP/notes.md"
          # The section below ours is the previous release, so the changelog
          # alone gives the compare range: no need to fetch the tags.
          PREVIOUS=$(awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; next }
            found && /^## v/ { print substr($2, 2); exit }
          ' resources/demo/changelog.md)
          if [ -s "$RUNNER_TEMP/notes.md" ] && [ -n "$PREVIOUS" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release notes::resources/demo/changelog.md has no section for ${GITHUB_REF_NAME}; publishing with generated notes"
          fi

      - name: Publish with the changelog section
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ vars.COLAMD_PRERELEASE == 'true' }}

      # A missing section still publishes, so a typo in the version number
      # cannot leave a tagged release unpublished. The warning above is the
      # signal to add the missing section.
      - name: Publish with generated notes
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ vars.COLAMD_PRERELEASE == 'true' }}
